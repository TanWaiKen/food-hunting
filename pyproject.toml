[project]
name = "foodhunt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic[mcp]>=2.12.0",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "openlocationcode>=1.0.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
foodhunt = "foodhunt.pipeline:main"
foodhunt-mcp = "foodhunt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.vercel]
entrypoint = "app:app"
