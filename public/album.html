<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Album · Food Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="album.css">
</head>
<body>
<header class="bar">
  <a class="back" id="backLink" href="trip.html">‹ Route</a>
  <span class="eyebrow" id="barTitle">Album</span>
  <div class="bar-actions">
    <label class="btn btn-quiet"><input type="checkbox" id="showSymbols" checked> Symbols</label>
    <button class="btn btn-quiet" id="printBtn" type="button">Print / PDF</button>
    <label class="btn btn-primary" for="fileInput">Add photos <span class="arrow" aria-hidden="true">→</span></label>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>
  </div>
</header>

<main id="album" aria-live="polite"><p class="loading">Opening the album…</p></main>

<div class="toast" id="toast" role="status" hidden></div>
<script src="album.js"></script>
</body>
</html>
