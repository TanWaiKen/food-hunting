<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Food Hunt</title>
<meta name="description" content="Verified, time-aware food routes — when to go, what to order, how to walk there.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="Food Hunt home">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--brand)"/><path d="M8 15h16a8 8 0 0 1-16 0Z" fill="#fff"/><path d="M12 11c0-2 2-2 2-4M17 11c0-2 2-2 2-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
    <span>Food Hunt</span>
  </a>
  <div class="topbar-actions">
    <select id="tripPicker" aria-label="Choose a trip" hidden></select>
    <a class="btn" id="albumLink" href="album.html">📷 Album</a>
    <button class="btn btn-primary" id="openAgent" type="button">✨ Plan a trip</button>
  </div>
</header>

<main class="layout">
  <section class="content" id="content" aria-live="polite">
    <div class="skeleton" id="loading">Loading trip…</div>
  </section>
  <aside class="mapwrap" aria-label="Map">
    <div id="map"></div>
    <button class="btn map-toggle" id="mapToggle" type="button" aria-pressed="false">Map</button>
  </aside>
</main>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<!-- Agent drawer -->
<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h2 id="drawerTitle">Plan a new food trip</h2>
    <button class="icon-btn" id="closeAgent" type="button" aria-label="Close">✕</button>
  </div>
  <p class="muted small" id="agentStatus">Claude researches Rednote, Google and the web, verifies each place, then plans the route.</p>
  <form id="agentForm">
    <label class="label" for="prompt">Where, how long, where you stay, must-eats</label>
    <textarea id="prompt" rows="4" required placeholder="Penang, 2 days next weekend, staying near Komtar. Must try char kway teow and cendol."></textarea>
    <div class="chips" id="examples">
      <button type="button" class="chip">Ipoh 1 day, staying at Old Town, must try 芽菜鸡</button>
      <button type="button" class="chip">Melaka 2 days, Jonker Street, nyonya food</button>
      <button type="button" class="chip">Hat Yai 2 days, Lee Gardens, halal options</button>
    </div>
    <div id="codeRow" hidden>
      <label class="label" for="accessCode">Access code</label>
      <input id="accessCode" type="password" autocomplete="off">
    </div>
    <button class="btn btn-primary wide" id="runAgent" type="submit">Plan it</button>
  </form>
  <ol class="agent-log" id="agentLog" aria-live="polite"></ol>
</aside>

<script src="app.js"></script>
</body>
</html>
